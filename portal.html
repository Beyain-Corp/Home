<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeyainCorp Portal — Client Login &amp; Notion CMS</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .portal-shell {
      min-height: calc(100vh - 73px);
      padding: 36px 0 64px;
    }
    .login-wrap {
      max-width: 480px;
      margin: 40px auto;
    }
    .portal-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: start;
    }
    .portal-sidebar {
      position: sticky;
      top: 92px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .portal-nav-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-soft);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.16s ease;
    }
    .portal-nav-btn:hover {
      background: var(--bg-white);
      border-color: var(--border);
      color: var(--text);
    }
    .portal-nav-btn.active {
      background: var(--primary);
      color: #ffffff;
    }
    .badge-status {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--bg-muted);
      color: var(--text-soft);
      border: 1px solid var(--border);
    }
    .badge-status.ok {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .badge-status.warn {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-white);
    }
    table.cms-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    .cms-table th, .cms-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .cms-table th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-muted);
      text-transform: uppercase;
    }
    .cms-table tr:last-child td {
      border-bottom: 0;
    }
    @media (max-width: 900px) {
      .portal-layout {
        grid-template-columns: 1fr;
      }
      .portal-sidebar {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .portal-nav-btn {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a href="/" class="brand">
        <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="url(#brandGrad)" />
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#0ea5e9" />
            </linearGradient>
          </defs>
          <path d="M20 18 H35 C41 18 45 21.5 45 26 C45 29 42.5 31 39.5 32 C43.5 33 46 36 46 39.5 C46 44 41.5 47 35 47 H20 Z M26 23.5 V29.5 H34 C37 29.5 38.5 28.2 38.5 26.5 C38.5 24.8 37 23.5 34 23.5 Z M26 35 V41.5 H35 C38.2 41.5 39.5 40.2 39.5 38.2 C39.5 36.2 38.2 35 35 35 Z" fill="#ffffff" />
        </svg>
        <span>BeyainCorp</span>
        <span class="brand-tag">PORTAL &amp; CMS</span>
      </a>

      <div class="nav-actions">
        <span id="backend-pill" class="badge-status">Checking Backend...</span>
        <button type="button" id="theme-toggle" class="icon-btn" title="Toggle Theme">☾</button>
        <a href="/" class="btn btn-outline btn-sm">← Public Site</a>
        <button type="button" id="logout-btn" class="btn btn-primary btn-sm" style="display:none;">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="portal-shell">
    <div class="container">
      <!-- LOGIN VIEW -->
      <section id="login-section" class="login-wrap">
        <div class="card" style="padding:32px;">
          <h1 class="section-title" style="font-size:28px;">Sign In to BeyainCorp Portal</h1>

          <form id="login-form" style="display:flex;flex-direction:column;gap:14px;margin-top:18px;">
            <div>
              <label class="field-label" for="login-email">Email Address</label>
              <input id="login-email" class="input" type="email" required placeholder="you@company.com" />
            </div>
            <div>
              <label class="field-label" for="login-password">Password</label>
              <input id="login-password" class="input" type="password" required placeholder="••••••••••••" />
            </div>
            <div id="login-error" class="font-mono" style="font-size:12px;color:#ef4444;display:none;"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In to Portal →</button>
          </form>

          <div style="margin-top:12px;text-align:right;">
            <button type="button" id="forgot-toggle-btn" style="background:none;border:0;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;padding:0;">Forgot / Reset Password?</button>
          </div>

          <form id="forgot-form" style="display:none;flex-direction:column;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
            <div class="font-mono" style="font-size:11px;color:var(--text-muted);">EMERGENCY PASSWORD RESET REQUEST</div>
            <input id="forgot-email" class="input" type="email" required placeholder="Registered email address" />
            <input id="forgot-note" class="input" type="text" placeholder="Optional note / phone for verification" />
            <div id="forgot-status" class="font-mono" style="font-size:12px;color:var(--primary);display:none;"></div>
            <button type="submit" class="btn btn-outline btn-sm">Request Emergency Reset →</button>
          </form>
        </div>
      </section>

      <!-- AUTHENTICATED PORTAL WORKSPACE -->
      <section id="portal-workspace" style="display:none;">
        <div class="portal-layout">
          <aside class="card portal-sidebar" style="padding:16px;">
            <div style="padding:6px 8px 12px;border-bottom:1px solid var(--border);margin-bottom:6px;">
              <div id="user-name" style="font-weight:700;font-size:15px;">User</div>
              <div id="user-meta" class="font-mono" style="font-size:11px;color:var(--text-muted);">Role</div>
            </div>

            <button type="button" class="portal-nav-btn admin-only active" data-tab="overview">Overview</button>
            <button type="button" class="portal-nav-btn" data-tab="tickets">Support Tickets</button>
            <button type="button" class="portal-nav-btn admin-only" data-tab="services">Services CMS</button>
            <button type="button" class="portal-nav-btn admin-only" data-tab="portfolio">Portfolio CMS</button>
            <button type="button" class="portal-nav-btn admin-only" data-tab="inquiries">Inquiries Inbox</button>
            <button type="button" class="portal-nav-btn admin-only" data-tab="users">Portal Users</button>
            <button type="button" class="portal-nav-btn admin-only" data-tab="notion">Notion DB Setup</button>
          </aside>

          <div id="portal-content">
            <!-- Populated dynamically by portal.js -->
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="portal.js"></script>
</body>
</html>
